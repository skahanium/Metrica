name: Golden R Smoke

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  r-ols-iv:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
      - name: Install R packages
        run: Rscript -e 'install.packages(c("jsonlite", "ivreg"), repos = "https://cloud.r-project.org")'
      - name: OLS coefficient smoke (golden linear_ols)
        run: Rscript scripts/golden/r_smoke/verify_ols.R
      - name: IV coefficient smoke (golden linear_iv)
        run: Rscript scripts/golden/r_smoke/verify_iv.R
      - name: Discrete glm smoke (logit / probit / poisson)
        run: Rscript scripts/golden/r_smoke/verify_discrete_glm.R
      - name: DID smoke (causal_did)
        run: Rscript scripts/golden/r_smoke/verify_causal_did.R
      - name: Cox PH smoke (duration_cox)
        run: |
          Rscript -e 'install.packages("survival", repos = "https://cloud.r-project.org")'
          Rscript scripts/golden/r_smoke/verify_duration_cox.R
      - name: Panel GMM smoke (dynamic_panel_gmm)
        run: |
          Rscript -e 'install.packages("plm", repos = "https://cloud.r-project.org")'
          Rscript scripts/golden/r_smoke/verify_panel_gmm.R
