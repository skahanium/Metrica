name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  julia-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12']
        package:
          - MetricaBase.jl
          - MetricaLinear.jl
          - MetricaGMM.jl
          - MetricaPanel.jl
          - MetricaDiscrete.jl
          - MetricaCausal.jl
          - MetricaSystem.jl
          - MetricaTimeSeries.jl
          - MetricaSurvey.jl
          - MetricaSpatial.jl
          - MetricaDuration.jl
          - MetricaBayes.jl
          - MetricaNonlinear.jl
          - MetricaQuantile.jl
          - MetricaData.jl
          - MetricaDiagnostics.jl
          - MetricaOutput.jl
          - MetricaRuntime.jl
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Test ${{ matrix.package }}
        run: julia --project=packages/${{ matrix.package }} -e 'using Pkg; Pkg.test()'

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Prepare Julia env for runtime bridge
        run: julia --project=packages/MetricaRuntime.jl -e 'using Pkg; Pkg.instantiate()'
      - name: Rust check
        run: cargo check --manifest-path runtime/metrica-runtime/Cargo.toml
      - name: Rust test
        run: cargo test --lib --manifest-path runtime/metrica-runtime/Cargo.toml
      - name: Runtime vertical slice (serial)
        run: cargo test --test vertical_slice --manifest-path runtime/metrica-runtime/Cargo.toml -- --test-threads=1

  app-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and test
        run: |
          cd apps/metrica-desktop
          npm ci
          npm test

  model-type-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Check model_type alignment
        run: julia scripts/check_model_type_alignment.jl

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rust clippy
        run: cargo clippy --manifest-path runtime/metrica-runtime/Cargo.toml -- -D warnings
      - name: App TypeScript check
        run: |
          cd apps/metrica-desktop
          npm ci
          npm run build
