name: Documentation
description: 报告文档缺口、错误或教程改进
title: "[Docs]: "
labels: ["docs", "status: needs-triage"]
body:
  - type: input
    id: path
    attributes:
      label: 文档路径
      placeholder: "e.g. README.md, docs/architecture/runtime-protocol.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题
      placeholder: "哪里不清楚、不准确或缺失？"
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: 建议修改
      placeholder: "可以给出你希望看到的说明、示例或链接。"
