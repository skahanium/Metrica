name: Feature Request
description: 提议新功能或改进
title: "[Feature]: "
labels: ["enhancement", "status: needs-triage"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 类别
      options:
        - 测试与验证
        - 文档与教程
        - 打包与分发
        - 开源基础设施
        - 开发体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 描述
      placeholder: 你希望实现什么？为什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 曾考虑过的替代方案
  - type: textarea
    id: contribution
    attributes:
      label: 你是否愿意提交 PR
      placeholder: "例如：愿意补文档 / 愿意补测试 / 暂时只是提议"
  - type: checkboxes
    id: phase
    attributes:
      label: 是否符合当前阶段
      description: 当前处于完善阶段，不接受新模型族请求
      options:
        - label: 这不涉及新增模型族或 model_type
          required: true
