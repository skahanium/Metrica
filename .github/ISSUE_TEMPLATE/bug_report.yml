name: Bug Report
description: 报告一个 bug
title: "[Bug]: "
labels: ["bug", "status: needs-triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 受影响区域
      options:
        - julia-core
        - runtime
        - app
        - docs
        - quality
        - unknown
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: 受影响包或路径
      placeholder: "e.g. packages/MetricaLinear.jl, runtime/metrica-runtime, apps/metrica-desktop"
  - type: input
    id: model_type
    attributes:
      label: 受影响的 model_type
      placeholder: "e.g. spatial_lag, garch, duration_cox"
  - type: input
    id: julia_version
    attributes:
      label: Julia 版本
      placeholder: "julia --version"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 加载数据集 ...
        2. 运行命令 ...
        3. 观察错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 粘贴错误消息或异常输出
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 已运行的验证命令
      placeholder: |
        bash scripts/dev/doctor.sh
        julia --project=packages/MetricaLinear.jl -e 'using Pkg; Pkg.test()'
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      placeholder: OS、数据集大小、相关日志等
