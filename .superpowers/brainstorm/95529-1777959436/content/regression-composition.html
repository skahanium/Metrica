<h2>散点+回归线构图方式</h2>
<p class="subtitle">如何将散点图与回归线结合</p>

<div class="options">
  <div class="option" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>极简散点+线</h3>
      <p>3-5个散点，一条回归线，高度抽象</p>
    </div>
  </div>
  
  <div class="option" data-choice="scattered" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>随机散点+线</h3>
      <p>散点随机分布，回归线穿过，更自然</p>
    </div>
  </div>
  
  <div class="option" data-choice="trend" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>趋势线为主</h3>
      <p>回归线突出，散点作为背景点缀</p>
    </div>
  </div>
  
  <div class="option" data-choice="combined" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>散点+线+置信带</h3>
      <p>增加置信区间带，体现不确定性</p>
    </div>
  </div>
</div>
