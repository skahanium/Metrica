<h2>σ符号构图方式</h2>
<p class="subtitle">几何化σ的构图选择</p>

<div class="options">
  <div class="option" data-choice="standalone" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>独立σ</h3>
      <p>σ单独呈现，无外框</p>
    </div>
  </div>
  
  <div class="option" data-choice="circle" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>圆形外框</h3>
      <p>σ嵌入圆形框中</p>
    </div>
  </div>
  
  <div class="option" data-choice="square" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>方形外框</h3>
      <p>σ嵌入方形框中</p>
    </div>
  </div>
  
  <div class="option" data-choice="rounded" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>圆角方形</h3>
      <p>σ嵌入圆角方形框中</p>
    </div>
  </div>
</div>
