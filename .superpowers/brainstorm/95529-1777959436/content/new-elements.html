<h2>重新选择核心元素</h2>
<p class="subtitle">体现计量经济学特色的其他方向</p>

<div class="options">
  <div class="option" data-choice="regression" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>散点+回归线</h3>
      <p>最经典的计量图像，体现拟合与预测</p>
    </div>
  </div>
  
  <div class="option" data-choice="beta" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>β符号变形</h3>
      <p>回归系数符号，几何化设计，简洁有力</p>
    </div>
  </div>
  
  <div class="option" data-choice="sigma" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>σ符号变形</h3>
      <p>标准差符号，体现统计与不确定性</p>
    </div>
  </div>
  
  <div class="option" data-choice="r-squared" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>R²符号变形</h3>
      <p>决定系数符号，体现模型解释力</p>
    </div>
  </div>
  
  <div class="option" data-choice="histogram" onclick="toggleSelect(this)">
    <div class="letter">E</div>
    <div class="content">
      <h3>直方图/分布曲线</h3>
      <p>数据分布可视化，体现统计分析能力</p>
    </div>
  </div>
  
  <div class="option" data-choice="boxplot" onclick="toggleSelect(this)">
    <div class="letter">F</div>
    <div class="content">
      <h3>箱线图</h3>
      <p>数据摘要可视化，体现描述统计能力</p>
    </div>
  </div>
</div>
