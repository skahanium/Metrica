<h2>简单符号设计方案</h2>
<p class="subtitle">简洁有力的计量符号</p>

<div class="options">
  <div class="option" data-choice="beta" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>β符号</h3>
      <p>回归系数符号，几何化变形</p>
    </div>
  </div>
  
  <div class="option" data-choice="sigma" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>σ符号</h3>
      <p>标准差符号，体现统计与不确定性</p>
    </div>
  </div>
  
  <div class="option" data-choice="r-squared" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>R²符号</h3>
      <p>决定系数符号，体现模型解释力</p>
    </div>
  </div>
  
  <div class="option" data-choice="m-letter" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>字母M变形</h3>
      <p>Metrica首字母，几何化设计</p>
    </div>
  </div>
  
  <div class="option" data-choice="infinity" onclick="toggleSelect(this)">
    <div class="letter">E</div>
    <div class="content">
      <h3>∞符号</h3>
      <p>无限符号，体现计量的无限可能</p>
    </div>
  </div>
</div>
