<h2>设计含义解释</h2>
<p class="subtitle">这个设计想表达什么</p>

<div class="section">
  <h3>DAG在计量经济学中的含义</h3>
  <p>DAG（有向无环图）是因果推断的核心工具：</p>
  <ul>
    <li><strong>节点</strong>：代表变量（如收入、教育、经验）</li>
    <li><strong>边</strong>：代表因果关系（A导致B）</li>
    <li><strong>钻石链式</strong>：体现因果链（A→B→C→D）</li>
  </ul>
</div>

<div class="section">
  <h3>设计想传达的信息</h3>
  <ul>
    <li><strong>专业性</strong>：计量经济学的核心工具</li>
    <li><strong>因果思维</strong>：不只是相关，更是因果</li>
    <li><strong>结构化</strong>：清晰的变量关系</li>
  </ul>
</div>

<div class="section">
  <h3>可能的改进方向</h3>
  <p>如果您觉得太抽象，我们可以：</p>
  <ul>
    <li>增加文字说明（如"因果"或"Causal"）</li>
    <li>使用更直观的符号（如回归线、散点图）</li>
    <li>结合字母M变形</li>
  </ul>
</div>
