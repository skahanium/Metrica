<h2>图标风格偏好</h2>
<p class="subtitle">请选择您偏好的视觉风格方向</p>

<div class="options">
  <div class="option" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>极简几何</h3>
      <p>简洁的几何形状，现代感强，适合科技产品</p>
    </div>
  </div>
  
  <div class="option" data-choice="abstract" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>抽象符号</h3>
      <p>抽象的字母或符号变形，独特且有辨识度</p>
    </div>
  </div>
  
  <div class="option" data-choice="data" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>数据可视化</h3>
      <p>融合图表、曲线等计量元素，体现专业性</p>
    </div>
  </div>
  
  <div class="option" data-choice="shield" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>徽章/盾牌</h3>
      <p>经典徽章造型，传达可靠与权威感</p>
    </div>
  </div>
</div>
