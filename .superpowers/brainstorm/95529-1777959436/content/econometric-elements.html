<h2>计量特色元素</h2>
<p class="subtitle">体现计量经济学的核心特征</p>

<div class="options">
  <div class="option" data-choice="regression" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>散点+回归线</h3>
      <p>最经典的计量图像，体现拟合与预测</p>
    </div>
  </div>
  
  <div class="option" data-choice="residual" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>残差分布</h3>
      <p>钟形曲线或残差图，体现统计检验能力</p>
    </div>
  </div>
  
  <div class="option" data-choice="ci" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>置信区间带</h3>
      <p>回归线+置信区间带，体现不确定性量化</p>
    </div>
  </div>
  
  <div class="option" data-choice="dag" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>因果图(DAG)</h3>
      <p>有向无环图，体现因果推断能力</p>
    </div>
  </div>
  
  <div class="option" data-choice="beta" onclick="toggleSelect(this)">
    <div class="letter">E</div>
    <div class="content">
      <h3>β符号</h3>
      <p>回归系数符号，几何化设计</p>
    </div>
  </div>
</div>
