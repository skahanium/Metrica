<h2>图标核心元素</h2>
<p class="subtitle">请选择图标中希望包含的核心视觉元素</p>

<div class="options">
  <div class="option" data-choice="m-letter" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>字母"M"变形</h3>
      <p>将Metrica首字母进行几何化设计</p>
    </div>
  </div>
  
  <div class="option" data-choice="chart" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>图表/曲线</h3>
      <p>融入柱状图、折线图等计量元素</p>
    </div>
  </div>
  
  <div class="option" data-choice="grid" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>网格/矩阵</h3>
      <p>体现数据结构与计算能力</p>
    </div>
  </div>
  
  <div class="option" data-choice="abstract" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>抽象几何组合</h3>
      <p>多个几何形状组合，无特定含义</p>
    </div>
  </div>
</div>
