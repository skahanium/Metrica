<h2>图标复杂度</h2>
<p class="subtitle">DAG抽象变形的细节程度</p>

<div class="options">
  <div class="option" data-choice="ultra-minimal" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>极简</h3>
      <p>2-3个节点，1-2条边，高度抽象</p>
    </div>
  </div>
  
  <div class="option" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>简洁</h3>
      <p>3-4个节点，2-3条边，适度抽象</p>
    </div>
  </div>
  
  <div class="option" data-choice="moderate" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>中等</h3>
      <p>4-5个节点，3-4条边，保留DAG特征</p>
    </div>
  </div>
</div>
