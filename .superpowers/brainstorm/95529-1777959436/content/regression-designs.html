<h2>极简散点+回归线设计方案</h2>
<p class="subtitle">三种不同的极简风格</p>

<div class="cards">
  <div class="card" data-choice="design1" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="width:120px;height:120px;margin:20px auto;position:relative;background:#f7fafc;border-radius:10px;">
        <!-- 坐标轴 -->
        <div style="position:absolute;bottom:20px;left:20px;width:80px;height:2px;background:#718096;"></div>
        <div style="position:absolute;bottom:20px;left:20px;width:2px;height:80px;background:#718096;"></div>
        <!-- 散点 -->
        <div style="position:absolute;bottom:35px;left:30px;width:8px;height:8px;background:#4a5568;border-radius:50%;"></div>
        <div style="position:absolute;bottom:45px;left:45px;width:8px;height:8px;background:#4a5568;border-radius:50%;"></div>
        <div style="position:absolute;bottom:55px;left:55px;width:8px;height:8px;background:#4a5568;border-radius:50%;"></div>
        <div style="position:absolute;bottom:65px;left:70px;width:8px;height:8px;background:#4a5568;border-radius:50%;"></div>
        <!-- 回归线 -->
        <div style="position:absolute;bottom:30px;left:25px;width:60px;height:2px;background:#e53e3e;transform:rotate(30deg);transform-origin:left;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>方案A：带坐标轴</h3>
      <p>保留坐标轴，散点+回归线，最直观</p>
    </div>
  </div>
  
  <div class="card" data-choice="design2" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="width:120px;height:120px;margin:20px auto;position:relative;background:#f7fafc;border-radius:10px;">
        <!-- 散点 -->
        <div style="position:absolute;top:30px;left:25px;width:10px;height:10px;background:#4a5568;border-radius:50%;"></div>
        <div style="position:absolute;top:45px;left:40px;width:10px;height:10px;background:#4a5568;border-radius:50%;"></div>
        <div style="position:absolute;top:55px;left:55px;width:10px;height:10px;background:#4a5568;border-radius:50%;"></div>
        <div style="position:absolute;top:65px;left:70px;width:10px;height:10px;background:#4a5568;border-radius:50%;"></div>
        <!-- 回归线 -->
        <div style="position:absolute;top:25px;left:20px;width:70px;height:2px;background:#e53e3e;transform:rotate(35deg);transform-origin:left;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>方案B：无坐标轴</h3>
      <p>去掉坐标轴，更简洁，现代感强</p>
    </div>
  </div>
  
  <div class="card" data-choice="design3" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="width:120px;height:120px;margin:20px auto;position:relative;background:#f7fafc;border-radius:10px;">
        <!-- 散点 - 更少 -->
        <div style="position:absolute;top:35px;left:30px;width:12px;height:12px;background:#4a5568;border-radius:50%;"></div>
        <div style="position:absolute;top:50px;left:50px;width:12px;height:12px;background:#4a5568;border-radius:50%;"></div>
        <div style="position:absolute;top:65px;left:70px;width:12px;height:12px;background:#4a5568;border-radius:50%;"></div>
        <!-- 回归线 - 更粗 -->
        <div style="position:absolute;top:30px;left:25px;width:65px;height:3px;background:#e53e3e;transform:rotate(35deg);transform-origin:left;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>方案C：极简3点</h3>
      <p>只保留3个散点，回归线更突出</p>
    </div>
  </div>
</div>
