<h2>更多主色调选项</h2>
<p class="subtitle">扩展颜色选择范围</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="blue" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>科技蓝</h3>
      <p>专业、可信赖，适合金融/科研领域</p>
    </div>
  </div>
  
  <div class="option" data-choice="teal" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>青绿/薄荷</h3>
      <p>现代、清新，兼具科技感与活力</p>
    </div>
  </div>
  
  <div class="option" data-choice="purple" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>深紫/靛蓝</h3>
      <p>高端、创新，适合学术/研究工具</p>
    </div>
  </div>
  
  <div class="option" data-choice="orange" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>橙色/琥珀</h3>
      <p>活力、友好，适合教学/入门工具</p>
    </div>
  </div>
  
  <div class="option" data-choice="green" onclick="toggleSelect(this)">
    <div class="letter">E</div>
    <div class="content">
      <h3>翠绿/森林</h3>
      <p>自然、成长，适合数据/分析工具</p>
    </div>
  </div>
  
  <div class="option" data-choice="red" onclick="toggleSelect(this)">
    <div class="letter">F</div>
    <div class="content">
      <h3>深红/酒红</h3>
      <p>经典、稳重，适合学术/专业工具</p>
    </div>
  </div>
  
  <div class="option" data-choice="slate" onclick="toggleSelect(this)">
    <div class="letter">G</div>
    <div class="content">
      <h3>石板灰/深灰</h3>
      <p>中性、专业，适合工具类应用</p>
    </div>
  </div>
  
  <div class="option" data-choice="gradient" onclick="toggleSelect(this)">
    <div class="letter">H</div>
    <div class="content">
      <h3>渐变色</h3>
      <p>现代、动感，适合年轻化品牌</p>
    </div>
  </div>
</div>
