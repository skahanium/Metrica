<h2>主色调偏好</h2>
<p class="subtitle">请选择您偏好的主色调方向</p>

<div class="options">
  <div class="option" data-choice="blue" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>科技蓝</h3>
      <p>专业、可信赖，适合金融/科研领域</p>
    </div>
  </div>
  
  <div class="option" data-choice="teal" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>青绿/薄荷</h3>
      <p>现代、清新，兼具科技感与活力</p>
    </div>
  </div>
  
  <div class="option" data-choice="purple" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>深紫/靛蓝</h3>
      <p>高端、创新，适合学术/研究工具</p>
    </div>
  </div>
  
  <div class="option" data-choice="orange" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>橙色/琥珀</h3>
      <p>活力、友好，适合教学/入门工具</p>
    </div>
  </div>
</div>
