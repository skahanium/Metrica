<h2>图标构图方式</h2>
<p class="subtitle">DAG元素与几何形状的结合方式</p>

<div class="options">
  <div class="option" data-choice="embedded" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>DAG嵌入几何</h3>
      <p>将DAG图嵌入圆形/方形等几何形状中</p>
    </div>
  </div>
  
  <div class="option" data-choice="standalone" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>DAG独立呈现</h3>
      <p>DAG图本身作为图标主体，无外框</p>
    </div>
  </div>
  
  <div class="option" data-choice="combined" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>DAG+字母组合</h3>
      <p>DAG图与字母M或Metrica首字母结合</p>
    </div>
  </div>
  
  <div class="option" data-choice="abstract" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>DAG抽象变形</h3>
      <p>将DAG节点和边进行几何化抽象处理</p>
    </div>
  </div>
</div>
