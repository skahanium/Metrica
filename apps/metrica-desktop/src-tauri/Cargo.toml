[package]
name = "metrica-desktop"
version = "0.1.0"
edition = "2021"
description = "Metrica Alpha 真实 OLS 桌面工作台"

[profile.dev]
opt-level = 0
debug = 0

[dependencies]
wry = "0.53"
tao = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
